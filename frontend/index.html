<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="APX International — secure, reliable international courier, freight & cargo services worldwide since 1990." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>APX International</title>
  </head>
  <body>
    <!-- Netlify Forms: hidden copy of the contact form so Netlify detects it at deploy time -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="service" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"><div style="position:fixed;inset:0;background:#050340"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
